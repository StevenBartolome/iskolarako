workflows:
  ios-sideload:
    name: iOS Sideload Build (Free Apple ID)
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      groups:
        - iskoako-env

    scripts:
      - name: Recreate env file from Codemagic secrets
        script: |
          cat > mobile/env << EOF
          EMAILJS_SERVICE_ID=$EMAILJS_SERVICE_ID
          EMAILJS_TEMPLATE_ID=$EMAILJS_TEMPLATE_ID
          EMAILJS_PUBLIC_KEY=$EMAILJS_PUBLIC_KEY
          GROQ_API_KEY=$GROQ_API_KEY
          OPENROUTER_API_KEY=$OPENROUTER_API_KEY
          MISTRAL_API_KEY=$MISTRAL_API_KEY
          HUGGINGFACE_API_KEY=$HUGGINGFACE_API_KEY
          GEMINI_API_KEY=$GEMINI_API_KEY
          GOOGLE_MAPS_API_KEY=$GOOGLE_MAPS_API_KEY
          EOF

      - name: Install Flutter dependencies
        script: flutter pub get
        working_directory: mobile

      - name: Build iOS (no code signing — Sideloadly will sign it)
        script: |
          flutter build ios --release --no-codesign || {
            echo "==> Flutter CLI build had a signing exit code; running xcodebuild directly..."
            xcodebuild -workspace ios/Runner.xcworkspace \
              -scheme Runner \
              -configuration Release \
              -sdk iphoneos \
              -destination generic/platform=iOS \
              -derivedDataPath build/ios_derived \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              PROVISIONING_PROFILE="" \
              build
            mkdir -p build/ios/iphoneos
            cp -r build/ios_derived/Build/Products/Release-iphoneos/Runner.app build/ios/iphoneos/Runner.app
          }
        working_directory: mobile

      - name: Package .app into .ipa
        script: |
          mkdir -p Payload
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            echo "Found Runner.app in build/ios/iphoneos"
            cp -r build/ios/iphoneos/Runner.app Payload/Runner.app
          elif [ -d "build/ios_derived/Build/Products/Release-iphoneos/Runner.app" ]; then
            echo "Found Runner.app in build/ios_derived"
            cp -r build/ios_derived/Build/Products/Release-iphoneos/Runner.app Payload/Runner.app
          else
            echo "Searching for Runner.app..."
            APP_PATH=$(find build -name "Runner.app" -type d | head -n 1)
            if [ -n "$APP_PATH" ]; then
              echo "Found Runner.app at: $APP_PATH"
              cp -r "$APP_PATH" Payload/Runner.app
            else
              echo "ERROR: Runner.app not found anywhere in build/!"
              exit 1
            fi
          fi
          zip -r IskoAko.ipa Payload
          rm -rf Payload
          ls -lh IskoAko.ipa
        working_directory: mobile

    artifacts:
      - mobile/IskoAko.ipa
